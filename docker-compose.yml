# Production-style deployment: PostgreSQL, API (+ web UI), monitoring worker, and Caddy for HTTPS.
# 1. cp .env.example .env and set CAMERA_ALLOWED_NETWORKS (secrets are generated if left empty)
# 2. docker compose up -d --build
# 3. docker compose exec api node dist/cli/createAdmin.js --username admin
services:
  # One-off step: writes the database password to a shared volume. Uses POSTGRES_PASSWORD from .env
  # when it is set; otherwise generates a random one on the first start and keeps it.
  init-secrets:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - secrets:/secrets
    command:
      - sh
      - -c
      - |
        set -eu
        f=/secrets/db_password
        if [ -n "$${POSTGRES_PASSWORD:-}" ]; then
          printf '%s' "$$POSTGRES_PASSWORD" > "$$f"
        elif [ ! -s "$$f" ]; then
          head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$f"
          echo "Generated a database password"
        fi
        chmod 644 "$$f"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cctv}
      POSTGRES_USER: ${POSTGRES_USER:-cctv}
      POSTGRES_PASSWORD_FILE: /run/cctv-secrets/db_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - secrets:/run/cctv-secrets:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cctv} -d ${POSTGRES_DB:-cctv}"]
      interval: 5s
      retries: 10

  api:
    build: .
    image: cctv-storage-monitor:latest
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cctv}@db:5432/${POSTGRES_DB:-cctv}
      DATABASE_PASSWORD_FILE: /run/cctv-secrets/db_password
      TRUST_PROXY: uniquelocal
      COOKIE_SECURE: "true"
    volumes:
      - secrets:/run/cctv-secrets:ro
      # Generated credential encryption key (used when CREDENTIAL_ENCRYPTION_KEY is not set). Back it up.
      - app-data:/app/server/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  worker:
    # Same image as the api; built locally, never pulled from a registry.
    build: .
    image: cctv-storage-monitor:latest
    pull_policy: build
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    volumes:
      - secrets:/run/cctv-secrets:ro
      - app-data:/app/server/data
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cctv}@db:5432/${POSTGRES_DB:-cctv}
      DATABASE_PASSWORD_FILE: /run/cctv-secrets/db_password
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    # The worker needs to reach the camera network. Docker's default bridge NAT usually works for
    # LAN addresses; if not, use `network_mode: host` and point DATABASE_URL at the host's database port.
    healthcheck:
      disable: true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Change in .env if these ports are taken on the host (e.g. HTTP_PORT=8080, HTTPS_PORT=8443).
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  secrets:
  app-data:
